   (añadir/modificar/borrar acciones concretas) que se aplica sobre la versión del servidor recién leída,
   con un bloqueo corto por partido: así dos dispositivos registrando a la vez no se pisan. */
const pendOps={}; const TAB=rid(); const evFlush={};
function applyOps(list,op){const seen=new Set(),out=[];list.forEach(e=>{if(op.del.includes(e.id))return;if(op.put[e.id]){if(!seen.has(e.id)){out.push(op.put[e.id]);seen.add(e.id);}}else out.push(e);});
  Object.keys(op.put).forEach(id=>{if(!seen.has(id)){out.push(op.put[id]);seen.add(id);}});return out;}
function chunkList(mid){return chunkIds(mid).sort((a,b)=>(+(a.split("~")[1]||0))-(+(b.split("~")[1]||0))).flatMap(k=>S.evc[k]||[]);}
function rebuildEvents(){const o={};Object.keys(S.evc).sort((a,b)=>{const ia=+(a.split("~")[1]||0),ib=+(b.split("~")[1]||0);return ia-ib;}).forEach(k=>{const mid=k.split("~")[0];(o[mid]=o[mid]||[]).push(...(S.evc[k]||[]));});
  Object.keys(pendOps).forEach(mid=>{(pendOps[mid]||[]).forEach(op=>{o[mid]=applyOps(o[mid]||[],op);});});S.events=o;}
function chunkIds(mid){return Object.keys(S.evc).filter(k=>k===mid||k.startsWith(mid+"~"));}
function toChunks(mid,list){const n=Math.max(1,Math.ceil(list.length/CHUNK)),o={};for(let i=0;i<n;i++)o[i?mid+"~"+i:mid]=list.slice(i*CHUNK,(i+1)*CHUNK);return o;}
function setLocalChunks(mid,list){chunkIds(mid).forEach(k=>delete S.evc[k]);Object.assign(S.evc,toChunks(mid,list));}
/* 2ª parte: si una acción de la 1ª parte pasa del final guardado (tiempo añadido), se alarga la 1ª parte y se desplaza la 2ª */
function shiftH2(m,list,newOff,setDur,oldOff){const o=oldOff!=null?oldOff:off2(m),d=newOff-o;
  const out=list.map(e=>{const h=e.half||(e.t<o?1:2);return h===2?{...e,half:2,t:e.t+d}:(e.half?e:{...e,half:1});});
  const dur={...(m.dur||{})}; if(setDur) dur[1]=newOff; else delete dur[1]; saveMatch(m,{dur});

  return out;}
function fixHalves(mid,list){const m=findMatch(mid);if(!m)return list;const o=off2(m);let mx=0;list.forEach(e=>{if(e.half===1&&e.t>mx)mx=e.t;});return mx>o?shiftH2(m,list,mx,true):list;}
function setOff2(m,newOff){const list=evs(m.id);let mx=0;list.forEach(e=>{if(halfOf(m,e)===1&&e.t>mx)mx=e.t;});newOff=Math.max(Math.round(newOff),mx);
  if(newOff===off2(m)&&durOf(m,1)===newOff)return; saveEvents(m.id,shiftH2(m,list,newOff,true));}
function saveEvents(mid,list,opt){
  list=fixHalves(mid,list);
  const B=new Map(evs(mid).map(e=>[e.id,e])),put={},del=[];
  list.forEach(e=>{const b=B.get(e.id);if(!b||JSON.stringify(b)!==JSON.stringify(e))put[e.id]=e;});
  if(!(opt&&opt.upsert)){const A=new Set(list.map(e=>e.id));B.forEach((e,id)=>{if(!A.has(id))del.push(id);});}
  if(!Object.keys(put).length&&!del.length){requestRender();return;}
  const op={put,del};
  if(!DB){setLocalChunks(mid,applyOps(chunkList(mid),op));rebuildEvents();requestRender();return;}
  (pendOps[mid]=pendOps[mid]||[]).push(op); rebuildEvents(); requestRender();
  evFlush[mid]=(evFlush[mid]||Promise.resolve()).then(()=>flushEvents(mid));
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function flushEvents(mid){
  const ops=(pendOps[mid]||[]).slice(); if(!ops.length) return;
  try{
    try{const lk=DB.doc("locks/ev-"+mid);for(let i=0;i<12;i++){const r=await lk.acquire({holder:TAB,ttlMs:15000});if(r&&r.acquired)break;await sleep(300+Math.random()*500);}}catch(e){}
    const server={};const known=chunkIds(mid).length;
    for(let i=0;;i++){const id=i?mid+"~"+i:mid;const d=await DB.doc("events/"+id).get();if(!d.exists){if(i>=known)break;continue;}server[id]=(d.data()||{}).list||[];}
    const ids=Object.keys(server).sort((a,b)=>(+(a.split("~")[1]||0))-(+(b.split("~")[1]||0)));
    let list=ids.flatMap(k=>server[k]); ops.forEach(op=>{list=applyOps(list,op);});
    const want=toChunks(mid,list);
    for(const [id,part] of Object.entries(want)){ if(JSON.stringify(server[id]||null)!==JSON.stringify(part)){
      try{await DB.doc("events/"+id).set({list:part});}catch(e){if(e&&e.code==="unavailable"){await sleep(600+Math.random()*600);await DB.doc("events/"+id).set({list:part});}else throw e;} } }
    for(const id of ids){ if(!want[id]) await DB.doc("events/"+id).delete(); }
    pendOps[mid]=(pendOps[mid]||[]).slice(ops.length); if(!pendOps[mid].length) delete pendOps[mid];
    setLocalChunks(mid,list); rebuildEvents(); requestRender();
  }catch(e){ showMsg(e&&e.code==="quota_exceeded"?"No queda espacio en este navegador: borra partidos antiguos o exporta una copia.":"No se han podido guardar las últimas acciones. Siguen en pantalla y se volverán a intentar guardar con la siguiente acción; no recargues la página hasta entonces."); }
}
const saveMatch=(m,patch)=>{const cur=findMatch(m.id)||m;const {id,...r}=cur;writeDoc(mPath(cur),{...r,...patch});};

/* ---------- datos ---------- */
const chains={};
function writeDoc(path,data){
  applyLocal(path,data);
  if(!DB) return Promise.resolve();
  const run=()=>DB.doc(path).set(data).catch(e=>{
    if(e&&e.code==="unavailable") return new Promise(r=>setTimeout(r,600+Math.random()*600)).then(()=>DB.doc(path).set(data));
    throw e;}).catch(e=>showMsg(e&&e.code==="quota_exceeded"?"No queda espacio en este navegador: borra partidos antiguos o exporta una copia.":"No se ha podido guardar. Vuelve a intentarlo."));
  chains[path]=(chains[path]||Promise.resolve()).then(run);return chains[path];
}
function removeDoc(path){
  applyLocal(path,null);
  if(!DB) return Promise.resolve();
  chains[path]=(chains[path]||Promise.resolve()).then(()=>DB.doc(path).delete()).catch(()=>showMsg("No se ha podido borrar."));
  return chains[path];
}
function applyLocal(path,data){
  const [col,id]=path.split("/");
  if(col==="rivals"){ S.rivals=S.rivals||{}; if(data) S.rivals[id]=data; else delete S.rivals[id]; requestRender(); return; }
  if(col==="settings"){ S.settings=data||{}; requestRender(); return; }
  if(col==="ai"){ S.ai=S.ai||{}; if(data) S.ai[id]=data.list||[]; else delete S.ai[id]; requestRender(); return; }
  if(col==="league"){ if(data) S.leagues[id]=data; else delete S.leagues[id]; requestRender(); return; }
  if(col==="events"){ if(data) S.evc[id]=data.list||[]; else delete S.evc[id]; rebuildEvents(); }
  else if(col==="poss"){ S.pz={...(S.pz||{})}; if(data) S.pz[id]=(data.list||[]).map(x=>Array.from(x)); else delete S.pz[id]; }
  else { const arr=col==="players"?S.players:col==="xmatches"?(S.ext=S.ext||[]):S.matches; const i=arr.findIndex(x=>x.id===id);
    if(data){const o={...data,id}; if(i>=0)arr[i]=o; else arr.push(o);} else if(i>=0) arr.splice(i,1); }
  requestRender();
}
function showMsg(m){S.msg=m;renderBanner();}

async function capUse(name){
  if(window.PlayerScorePlatform){ try{ return await window.PlayerScorePlatform.use(name); }catch(e){ return null; } }
  for(let i=0;i<30&&!(window.claude&&window.claude.use);i++) await new Promise(r=>setTimeout(r,100));
  try{ return window.claude&&window.claude.use ? await window.claude.use(name) : null; }catch(e){return null}
}
async function initDB(){
  DB = await capUse("db");
  if(!DB){dbState="local";renderBanner();render();return;}
  dbState="ok";renderBanner();
  const err=e=>{dbState="error";renderBanner();};
  DB.collection("players").onSnapshot(s=>{S.players=s.docs.map(d=>({...d.data(),id:d.id}));requestRender();},err);
  DB.collection("matches").onSnapshot(s=>{S.matches=s.docs.map(d=>({...d.data(),id:d.id}));autoSeason();requestRender();},err);
  DB.collection("xmatches").onSnapshot(s=>{S.ext=s.docs.map(d=>({...d.data(),id:d.id,ext:true}));requestRender();},err);
  DB.collection("rivals").onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());S.rivals=o;requestRender();},err);
  DB.doc("settings/main").onSnapshot(d=>{S.settings=d.exists?d.data():{};requestRender();},err);
  DB.collection("league").onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());S.leagues=o;requestRender();},err);
  DB.collection("ai").onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=(d.data().list||[]));S.ai=o;requestRender();},err);
  DB.collection("poss").onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=(d.data().list||[]).map(x=>Array.from(x)));const mine=S.pz||{};Object.keys(mine).forEach(k=>{if(pzTimer&&(!o[k]||mine[k].length>o[k].length))o[k]=mine[k];});S.pz=o;requestRender();},err);
  DB.collection("events").onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=(d.data().list||[]));S.evc=o;rebuildEvents();requestRender();},err);
}
function renderBanner(){

/* ---------- consultas ---------- */
const player=id=>S.players.find(p=>p.id===id);
const pname=id=>player(id)?.name||(id?"Jugador borrado":"—");
/* partidos externos (dos equipos que no son el nuestro): colección "xmatches", aparte de los nuestros para que no entren en nada de la temporada */
const findMatch=id=>S.matches.find(m=>m.id===id)||(S.ext||[]).find(m=>m.id===id);
const allMatches=()=>[...S.matches,...(S.ext||[])];
const mPath=m=>(m&&m.ext?"xmatches/":"matches/")+m.id;
const match=()=>findMatch(S.matchId);
const evs=mid=>S.events[mid]||[];
const halfLen=m=>(m&&m.halfLen)||35;
/* Duración real de cada parte (m.dur = {1: s, 2: s}). El minuto de partido es continuo:
   la 2ª parte empieza donde acaba la 1ª (off2). Sin duración guardada, se usa la reglamentaria. */
const durOf=(m,h)=>{const d=m&&m.dur&&m.dur[h];return d>0?d:null;};
const off2=m=>durOf(m,1)||halfLen(m)*60;
const tOff=(m,h)=>h===2?off2(m):0;
const halfOf=(m,e)=>e.half||(e.t<off2(m)?1:2);
const relT=(m,e)=>e.t-tOff(m,halfOf(m,e));
/* Fin del partido según lo jugado en el vídeo: la duración guardada de cada parte (Fin de la parte) o, si no, hasta la última acción registrada.
   Una parte sin acciones ni duración no cuenta (0'). Un partido sin ninguna acción usa la duración reglamentaria. */
const matchEnd=m=>{const o2=off2(m);const d2=durOf(m,2);if(d2)return o2+d2;const E=evs(m.id).filter(e=>!["marca","ctx","rcambio"].includes(e.type));
  const h2=E.filter(e=>halfOf(m,e)===2);if(h2.length)return o2+Math.max(0,...h2.map(e=>e.t-o2));
  if(durOf(m,1))return o2; const h1=E.filter(e=>halfOf(m,e)===1&&!["cambio","posicion","formacion","swap","xsub","xform"].includes(e.type));
  if(h1.length)return Math.max(...h1.map(e=>e.t)); return halfLen(m)*120;};
const tAbs=(m,half,sec)=>tOff(m,half)+sec;
const tLabel=(m,t)=>fmt(t);
const sortedPlayers=()=>S.players.filter(inSeason).sort((a,b)=>(POSICIONES.indexOf(a.pos)-POSICIONES.indexOf(b.pos))||a.name.localeCompare(b.name,"es"));
function remap(from,to,cur){
  const A=FORMACIONES[from]||[], Bs=FORMACIONES[to]||[]; const pos=Object.fromEntries(A.map(([k,x,y])=>[k,[x,y]]));
  const pairs=[]; Object.keys(cur).forEach(k=>{const p=pos[k]||[50,50];Bs.forEach(([nk,x,y])=>pairs.push([Math.hypot(p[0]-x,p[1]-y),k,nk]));});
  pairs.sort((a,b)=>a[0]-b[0]); const out={}, usedO=new Set();
  const asg={}; pairs.forEach(([,k,nk])=>{if(usedO.has(k)||Object.values(asg).includes(nk))return;asg[k]=nk;usedO.add(k);});
  const np=Object.fromEntries(Bs.map(([k,x,y])=>[k,[x,y]])); const dd=(k,nk)=>{const p=pos[k]||[50,50],q=np[nk];return (p[0]-q[0])**2+(p[1]-q[1])**2;};
  const ks=Object.keys(asg); let better=true, guard=0;
  while(better&&guard++<200){better=false;for(let i=0;i<ks.length;i++)for(let j=i+1;j<ks.length;j++){const a=ks[i],b=ks[j];
    if(dd(a,asg[b])+dd(b,asg[a])<dd(a,asg[a])+dd(b,asg[b])-1e-9){const t=asg[a];asg[a]=asg[b];asg[b]=t;better=true;}}}
  ks.forEach(k=>out[asg[k]]=cur[k]);
  return out;
}
/* Expulsiones de nuestros jugadores: roja directa o segunda amarilla */
function expulsions(m){const cnt={},out=[];evs(m.id).filter(e=>e.type==="tarjeta"&&e.p).sort((a,b)=>a.t-b.t).forEach(e=>{
  if(out.some(x=>x.p===e.p))return; if(e.res==="roja"){out.push({p:e.p,t:e.t});return;} if(e.res==="amarilla"){cnt[e.p]=(cnt[e.p]||0)+1;if(cnt[e.p]>=2)out.push({p:e.p,t:e.t});}});return out;}
function lineupAt(m,t){
  let f=m.formation; const slots=FORMACIONES[f]||[]; const lu=m.lineup||{};
  let cur={}; slots.forEach(([k])=>{if(lu[k])cur[k]=lu[k]});
  const L=evs(m.id).filter(e=>(e.type==="cambio"||e.type==="posicion"||e.type==="formacion"||e.type==="swap")&&e.t<=t).concat(expulsions(m).filter(x=>x.t<=t).map(x=>({type:"expulsion",p:x.p,t:x.t})));
  L.sort((a,b)=>a.t-b.t).forEach(e=>{
    if(e.type==="cambio"){const k=Object.keys(cur).find(k=>cur[k]===e.out); if(k) cur[k]=e.in;}
    if(e.type==="posicion"){const ka=Object.keys(cur).find(k=>cur[k]===e.a),kb=Object.keys(cur).find(k=>cur[k]===e.b); if(ka&&kb){cur[ka]=e.b;cur[kb]=e.a;}}
    if(e.type==="formacion"&&FORMACIONES[e.to]){cur=remap(f,e.to,cur);f=e.to;}
    if(e.type==="swap"){Object.keys(cur).forEach(k=>{if(cur[k]===e.a)cur[k]=e.b;else if(cur[k]===e.b)cur[k]=e.a;});}
    if(e.type==="expulsion"){const k=Object.keys(cur).find(k=>cur[k]===e.p); if(k) delete cur[k];}
  });
  return {f,cur};
}
function onField(m,t){return lineupAt(m,t).cur;}
/* minutos de cada jugador sacados de la misma alineación que usa todo lo demás (cambios, posiciones, formaciones, confusiones y expulsiones),
   así siempre coinciden con la suma de sus minutos por posición */
function minutes(m){
  const T=matchEnd(m); const acc={};
  Object.values(m.lineup||{}).forEach(p=>acc[p]=0);
  const cuts=new Set([0,Math.min(off2(m),T),T]);
  evs(m.id).forEach(e=>{if(["cambio","posicion","formacion","swap"].includes(e.type)&&e.t>0&&e.t<T)cuts.add(e.t);});
  expulsions(m).forEach(x=>{if(x.t>0&&x.t<T)cuts.add(x.t);});
  const cs=[...cuts].sort((a,b)=>a-b);
  for(let i=0;i<cs.length-1;i++){const d=cs[i+1]-cs[i];if(d<=0)continue;new Set(Object.values(lineupAt(m,cs[i]).cur)).forEach(p=>{acc[p]=(acc[p]||0)+d;});}
  evs(m.id).forEach(e=>{if(e.type==="cambio"&&e.in&&acc[e.in]==null)acc[e.in]=0;});
  return acc;
}
function score(m){
  let f=0,c=0; evs(m.id).forEach(e=>{if(e.type==="ocasion"&&e.acaba==="Gol"){if(e.side==="favor")f++;else c++;}});
  return {f,c};
}

function teamCard(){const t=teamOf(S.season),T=(S.settings||{}).teams||{};

function minutesCard(){
  const K=S.minK||"todos";
  const all=seasonMatches().filter(m=>Object.keys(m.lineup||{}).length&&!(m.excl||[]).includes("min"));
  if(!all.length) return "";
  const ms=all.filter(m=>K==="todos"||m.kind===K);
  const tabs=`<div class="seg">${[["todos","Todos"],["liga","Liga"],["amistoso","Amistosos"]].map(([k,l])=>`<button class="${K===k?"on":""}" data-act="mink" data-v="${k}">${l} <span class="muted num" style="font-weight:400">${all.filter(m=>k==="todos"||m.kind===k).length}</span></button>`).join("")}</div>`;
  if(!ms.length) return `<div class="card stack"><div class="row between"><h3 style="margin:0">Reparto de minutos</h3>${tabs}</div><p class="muted" style="margin:0">No hay partidos ${K==="liga"?"de liga":"amistosos"} con minutos todavía.</p></div>`;
  const pos=ms.reduce((a,m)=>a+matchEnd(m)/60,0); const R={};
  ms.forEach(m=>{const mn=minutes(m);const tit=new Set(Object.values(m.lineup||{}));Object.entries(mn).forEach(([p,sec])=>{const o=R[p]=R[p]||{min:0,pj:0,tit:0};o.min+=sec/60;if(sec>0)o.pj++;if(tit.has(p))o.tit++;});});
  const list=S.players.filter(inSeason).map(p=>({p,o:R[p.id]||{min:0,pj:0,tit:0}})).sort((a,b)=>b.o.min-a.o.min||a.p.name.localeCompare(b.p.name,"es"));
  return `<div class="card stack"><div class="row between"><h3 style="margin:0">Reparto de minutos</h3>${tabs}</div><span class="muted num" style="font-size:13px">${ms.length} ${ms.length===1?"partido":"partidos"}${K==="liga"?" de liga":K==="amistoso"?" amistosos":""} · ${Math.round(pos)}' posibles por jugador</span>
    <div class="scroll"><table><thead><tr><th>Jugador</th><th class="n">Partidos</th><th class="n">Titular</th><th class="n">Minutos</th><th>% de los posibles</th></tr></thead><tbody>
    ${list.map(({p,o})=>{const pc=pos?Math.round(o.min*100/pos):0;return `<tr><td>${p.dorsal?`<span class="muted num">${esc(p.dorsal)}</span> `:""}${esc(p.name)}${p.active===false?' <span class="pill off">De baja</span>':""}</td><td class="n">${o.pj}</td><td class="n">${o.tit}</td><td class="n">${Math.round(o.min)}</td><td><span class="row" style="gap:6px;flex-wrap:nowrap"><span class="ixbar"><span style="width:${pc}%"></span></span><span class="num">${pc}%</span></span></td></tr>`;}).join("")}</tbody></table></div>
    ${info("Minutos reales de cada partido de la temporada con alineación: cuentan la duración real de las partes, los cambios y las expulsiones. No cuentan los partidos en los que desmarcaste «Minutos jugados».")}</div>`;
}

const XSIDES=["A","B"];

function xGoals(m){let a=0,b=0;evs(m.id).forEach(e=>{if(e.type==="ocasion"&&e.acaba==="Gol"){if(e.side==="favor")a++;else b++;}});return {a:m.gA??a,b:m.gB??b};}

function knownTeams(){return [...new Set([...S.matches.map(m=>m.rival),...((S.league||{}).teams||[]),...(S.ext||[]).flatMap(m=>[m.teamA,m.teamB]),...Object.values(S.rivals||{}).map(r=>r.name)])].filter(x=>x&&x!==US()).sort((a,b)=>a.localeCompare(b,"es"));}

function xLineupCard(m,sd){const f=((m.xform||{})[sd])||"4-3-3",LU=((m.xlu||{})[sd])||{},P=S.xPick&&S.xPick.side===sd?S.xPick.k:null;const slots=FORMACIONES[f]||[];

/* ---- Vídeo del partido externo: registro de los dos equipos ---- */
const X_RES=[["Gol","Gol"],["A puerta","A puerta (parada)"],["Fuera","Fuera"],["Bloqueado","Bloqueado"],["Al palo","Al palo"],["Sin tiro","Sin tiro"]];
const X_ACABA={"Gol":"Gol","A puerta":"Tiro a puerta","Fuera":"Fuera","Bloqueado":"Bloqueado","Al palo":"Al palo","Sin tiro":"Sin tiro"};
const X_KIND={occ:"Ocasión / tiro",corner:"Córner",falta:"Falta recibida",rec:"Recupera el balón",card:"Tarjeta",sub:"Cambio",form:"Cambio de formación"};
const xPlName=(m,sd,k,lab)=>{const nm=rivName(m,k,lab!=null?lab:k,sd);return lab!=null?(/^\d+$/.test(lab)?lab:lab)+(nm?" · "+nm:""):(nm||LABELS[k]||k);};
function xOnField(m,sd,t){return sideState(m,sd,t+0.5).slots;}
function xQs(m,d){const pl=xOnField(m,d.side,d.t).map(([k,lab])=>[k,xPlName(m,d.side,k,lab)]);const Q=[];
  if(d.kind==="occ"){Q.push(["lvl","Nivel de la ocasión",[["1","1 · Poco clara"],["2","2 · Posibilidades"],["3","3 · Muy clara"],["4","4 · Clarísima"],["pen","Penalti"]],1]);
    if(d.lvl!=="pen")Q.push(["origen","Origen",ORIGENES.filter(x=>x!=="Ataque en campo rival").map(x=>[x,x])]);
    Q.push(["res","Cómo acaba",d.lvl==="pen"?X_RES.filter(x=>x[0]!=="Bloqueado"&&x[0]!=="Sin tiro"):X_RES,1]);
    Q.push(["sh",d.res==="Gol"?"Goleador":d.res==="Sin tiro"?"Jugador que la tiene":"Quién tira",pl]);
    if(d.res==="Gol")Q.push(["as","Asistencia",pl.filter(x=>x[0]!==d.sh)]);}
  if(d.kind==="corner")Q.push(["res","Cómo acaba",[["sin","Sin ocasión"],["occ","Ocasión o remate (te pide los datos)"]],1]);
  if(d.kind==="card"){Q.push(["p","Jugador",pl,1]);Q.push(["res","Tarjeta",[["amarilla","Amarilla"],["roja","Roja"]],1]);}
  if(d.kind==="sub")Q.push(["p","Sale",pl,1]);
  if(d.kind==="form"){const cur=sideState(m,d.side,d.t).f;Q.push(["to",`Nueva formación (ahora ${cur})`,Object.keys(FORMACIONES).filter(x=>x!==cur).map(x=>[x,x]),1]);}
  return Q;}
const xZones=d=>d.kind==="occ"?[["z","Zona donde empieza la jugada"],...(d.res&&d.res!=="Sin tiro"?[["zt","Zona del tiro"]]:[])]:d.kind==="falta"?[["z","Zona de la falta"]]:d.kind==="rec"?[["z","Zona de la recuperación"]]:[];
function xPanel(m){const d=S.xd;const tn=sideTeam(m,d.side);
  if(d.kind==="pl"){const nm=xPlName(m,d.side,d.k,d.lab);
    return `<div class="card stack lvpanel" style="gap:8px"><b>${esc(nm)} (${esc(tn)}) · min ${fmt(d.t-tOff(m,d.half))}</b><div class="lacts"><button class="bad" data-act="xplk" data-v="occ">Ocasión / tiro</button><button data-act="xplk" data-v="card">Tarjeta</button><button data-act="xplk" data-v="sub">Sale (cambio)</button></div><div class="row"><button class="btn small ghost" data-act="xx">Cancelar</button></div></div>`;}

  const sub=d.kind==="sub"?`<div class="opt"><span class="label">Entra</span><div class="row"><input id="xd-in" value="${esc(d.in||"")}" placeholder="Dorsal" maxlength="8" style="width:90px"><input id="xd-inn" value="${esc(d.inn||"")}" placeholder="Nombre (opcional)" maxlength="40" style="width:170px"></div></div>`:"";

    <p class="muted" style="margin:0;font-size:12px">Las zonas se miran desde ${esc(sideTeam(m,"A"))} (local): ataca hacia abajo.</p></div>`;}
function xSave(m){const d=S.xd;if(!d)return;const ti=$("#xd-t");if(ti){const v=parseT(ti.value);if(v!=null)d.t=tAbs(m,d.half,v);}
  if(d.kind==="sub"){d.in=($("#xd-in")?.value||"").trim();d.inn=($("#xd-inn")?.value||"").trim();}
  const Q=xQs(m,d);if(Q.some(q=>q[3]&&d[q[0]]==null))return;
  const base={id:rid(),t:Math.round(d.t),half:d.half};const L=xOnField(m,d.side,d.t);const pidOf=k=>{const s=L.find(x=>x[0]===k);return s?sidePid(d.side,k,s[1]):null;};const out=[];
  if(d.kind==="occ"){const pen=d.lvl==="pen",res=d.res;const e={...base,type:"ocasion",side:xFav(d.side),xs:d.side,origen:pen?"Penalti":(d.origen||"Sin dato"),tiro:res==="Sin tiro"?"no":"si",acaba:X_ACABA[res]};
    if(pen)e.pen=true;else e.pel=Number(d.lvl);if(res!=="Sin tiro")e.tres=res;if(d.z)e.z=d.z;if(d.zt)e.zt=d.zt;if(d.sh){e.xsh=pidOf(d.sh);}if(res==="Gol"&&d.as)e.xas=pidOf(d.as);out.push(e);}
  if(d.kind==="corner"){out.push({...base,type:"bparado",bt:"Córner",side:xFav(d.side),xs:d.side,res:d.res==="occ"?"remate":"despeje"});}
  if(d.kind==="falta")out.push({...base,type:"xfalta",side:xFav(d.side),xs:d.side,...(d.z?{z:d.z}:{})});
  if(d.kind==="rec")out.push({...base,type:"xbal",side:xFav(d.side),xs:d.side,...(d.z?{z:d.z}:{})});
  if(d.kind==="card"){const s=L.find(x=>x[0]===d.p);out.push({...base,type:"xcard",side:d.side,k:d.p,lab:s&&s[1]!=null?s[1]:null,res:d.res});}
  if(d.kind==="sub"){const s=L.find(x=>x[0]===d.p);out.push({...base,type:"xsub",side:d.side,k:d.p,out:s&&s[1]!=null?s[1]:null,in:d.in||null});
    if(d.in&&d.inn){const tn=sideTeam(m,d.side);const r=rivalDoc(tn);const prev=(r.dorsales||{})[d.in]||{};saveRival(tn,{dorsales:{...(r.dorsales||{}),[d.in]:{...prev,nombre:d.inn}}});}}
  if(d.kind==="form")out.push({...base,type:"xform",side:d.side,to:d.to,from:sideState(m,d.side,d.t).f});

function xAcierto(side,E){const oc=E.filter(e=>e.type==="ocasion"&&e.side===side);const x=oc.reduce((a,e)=>a+xgOf(e),0),xs=oc.reduce((a,e)=>a+xgShot(e),0),g=oc.filter(e=>e.acaba==="Gol").length;

function xOrigin(side,E){const oc=E.filter(e=>e.type==="ocasion"&&e.side===side);const tot=oc.reduce((a,e)=>a+xgOf(e),0);const pc=v=>tot>0?Math.round(100*v/tot):0;

let tickTimer=null,lastTick=0;
function clockKey(){return "clock:"+S.matchId}

function setRunning(on){
  S.clock.running=on; clearInterval(tickTimer);
  if(on){lastTick=performance.now();tickTimer=setInterval(()=>{const n=performance.now();S.clock.sec+=(n-lastTick)/1000;lastTick=n;paintClock();},250);}
  else saveClock();
  paintClock();
}
function paintClock(){
  const el=$("#clk"); if(el) el.textContent=fmt(S.clock.sec);
  const b=$("#clkplay"); if(b) b.textContent=S.clock.running?"Pausa":"Iniciar";
  document.querySelectorAll(".clkbig").forEach(x=>{x.textContent=S.clock.running?"❚❚":"▶";x.classList.toggle("run",S.clock.running);x.setAttribute("aria-label",S.clock.running?"Pausa":"Iniciar");});

  const L=[];const posAt=(p,t)=>{if(!p)return null;const LA=lineupAt(m,t+0.5);const k=Object.keys(LA.cur).find(k=>LA.cur[k]===p);return k?(LABELS[k]||k):null;};
  const byId={};E.forEach(x=>byId[x.id]=x);const root=x=>{let r=x,g=0;while(r.shot&&byId[r.shot]&&g++<10)r=byId[r.shot];return r.id;};
  const add=(k,p,z,e,ok)=>{if(p&&!player(p))return;L.push({k,p:p||null,z:z||null,id:e.id,r:root(e),t:e.t,pos:posAt(p,e.t),...(ok!=null?{ok}:{})});};

    if(["clave","supera","regate","maladec","colof_m","fuera","falta_r","fuerza","falta_c","tarjeta","buenact","actitud","parada","salidap","saque","golenc"].includes(t)) add(t,e.p,e.z,e);

    if(t==="despeje") add("despeje",e.p,e.z,e,ok);
    if(t==="duelo"){add("duelo",e.p,e.z,e,ok);if(e.dt==="aereo")add("duelo_aer",e.p,e.z,e,ok);}
    if(t!=="pase"&&isLoss(e)&&!e.lossT){add("perdida",e.p||e.quien,e.zp||e.z,e);if(e.pres==="si"||e.pres==="no")add(e.pres==="si"?"perdida_p":"perdida_np",e.p||e.quien,e.zp||e.z,e);}

    if(!ex.has("min")) Object.entries(minutes(m)).forEach(([p,s])=>{if(!player(p))return;min[p]=(min[p]||0)+s/60;if(s>0)pj[p]=(pj[p]||0)+1;
      Object.entries(slotMinutes(m,p)).forEach(([lb,mm])=>{const o=posMin[p]=posMin[p]||{};o[lb]=(o[lb]||0)+mm;if(mm>0){const q=posPj[p]=posPj[p]||{};q[lb]=(q[lb]||0)+1;}});});

function tramosCard(T){
  const keys=[];[1,2].forEach(h=>[0,1,2].forEach(i=>keys.push(h+"-"+i)));
  const lab=k=>{const [h,i]=k.split("-").map(Number);return {l:(h===1?"1ª ":"2ª ")+(i*12),d:i<2?"-"+(i*12+12):"-fin"};};
  const rows=f=>keys.map(k=>{const b=T.bins[k]||{pelF:0,pelC:0,gf:0,gc:0,perd:0,rec:0,ocF:0,ocC:0};return {...lab(k),vals:f(b)};});
  if(!Object.keys(T.bins).length) return "";
  return `<div class="card stack"><h3 style="margin:0">Por tramos del partido</h3>
    <div class="fields" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">
      ${barChart("Peligrosidad",rows(b=>[b.pelF,b.pelC]),[{n:"A favor",c:C_F},{n:"En contra",c:C_C}],{fmt:fx})}
    </div><details class="info"><summary>ⓘ Cómo se calcula</summary><p>Tramos de 12 minutos en cada parte; el último incluye hasta el final de la parte.</p></details></div>`;
}
function eficaciaCard(T){
  if(!T.ocF&&!T.ocC) return "";
  const row=l=>{const f=T.lv.favor[l]||{n:0,tiro:0,gol:0},c=T.lv.contra[l]||{n:0,tiro:0,gol:0};return `<tr><td>${esc(PEL_OPTS[l-1][1])}</td><td class="n">${f.n}</td><td class="n">${f.tiro}</td><td class="n">${f.gol}</td><td class="n">${pct(f.gol,f.n)}</td><td class="n">${c.n}</td><td class="n">${c.tiro}</td><td class="n">${c.gol}</td><td class="n">${pct(c.gol,c.n)}</td></tr>`;};
  return `<div class="card stack"><h3 style="margin:0">Ocasiones por nivel y eficacia</h3>
    <div class="scroll"><table><thead><tr><th>Nivel de la ocasión</th><th class="n">A favor</th><th class="n">Con tiro</th><th class="n">Goles</th><th class="n">Conversión</th><th class="n">En contra</th><th class="n">Con tiro</th><th class="n">Goles</th><th class="n">Conversión</th></tr></thead><tbody>${[1,2,3,4].map(row).join("")}</tbody></table></div>
    <details class="info"><summary>ⓘ Cómo se calcula</summary><p>Peligrosidad: cada ocasión suma según su nivel (nivel 1 = 0,05 · nivel 2 = 0,15 · nivel 3 = 0,40 · nivel 4 = 0,75) y cada penalti 0,75, también cuando acaba en gol. xG (goles esperados) = peligrosidad de las ocasiones que acaban en tiro × el factor de acierto de la categoría. Si marcáis más de lo esperado estáis siendo eficaces; si menos, falta acierto.</p></details></div>`;
}

function ctxAt(m,t){
  const out={pres_nos:null,pres_riv:null,form_riv:null,atq_nos:null,atq_riv:null};
  const list=evs(m.id).filter(e=>e.type==="ctx").sort((a,b)=>a.t-b.t);
  Object.keys(out).forEach(k=>{const f=list.find(e=>e.which===k); if(f) out[k]=ctxVal(f);});
  list.filter(e=>e.t<=t).forEach(e=>out[e.which]=ctxVal(e));
  return out;
}

function buildDataset(ms){
  const nm=id=>id?pname(id):null;
  const jugadores=S.players.map(p=>({nombre:p.name,posicion:p.pos,tambien:p.alt||[],activo:p.active!==false}));
  const partidos=[],segmentos=[],acciones=[];
  ms.forEach(m=>{
    const r=score(m); const T=matchEnd(m), H=Math.min(off2(m),T);
    partidos.push({partido:m.rival,fecha:m.date,tipo:m.kind,campo:m.home?"local":"visitante",jornada:m.jornada??null,minutosPorParte:halfLen(m),formacionInicial:m.formation,
      golesFavor:m.gf??r.f,golesContra:m.ga??r.c});
    const E=evs(m.id);
    const cuts=new Set([0,H,T]); E.forEach(e=>{if(["cambio","posicion","formacion","ctx","swap"].includes(e.type)&&e.t>0&&e.t<T)cuts.add(e.t);}); expulsions(m).forEach(x=>{if(x.t>0&&x.t<T)cuts.add(x.t);});
    const cs=[...cuts].sort((a,b)=>a-b);
    for(let i=0;i<cs.length-1;i++){const a=cs[i],b=cs[i+1]; if(b<=a) continue; const LA=lineupAt(m,a), c=ctxAt(m,a);
      segmentos.push({partido:m.rival,fecha:m.date,parte:a<H?1:2,desde:Math.round(a/60*10)/10,hasta:Math.round(b/60*10)/10,minutos:Math.round((b-a)/60*10)/10,
        formacion:LA.f,enCampo:Object.entries(LA.cur).map(([k,id])=>({jugador:nm(id),puesto:LABELS[k]||k})),presionNuestra:c.pres_nos,presionRival:c.pres_riv,formacionRival:c.form_riv,ataqueNuestro:c.atq_nos,ataqueRival:c.atq_riv});}
    E.forEach(e=>{ if(["ctx"].includes(e.type)) return;
      const LA=lineupAt(m,e.t), c=ctxAt(m,e.t);
      const o={partido:m.rival,fecha:m.date,minuto:Math.round(e.t/60*10)/10,parte:halfOf(m,e),tipo:e.type==="ocasion"?"ocasion":e.type,
        jugador:nm(e.p||e.quien),zona:e.z?zid(e.z):null,zonaDestino:e.z2?zid(e.z2):null,
        esPerdida:isLoss(e),esRecuperacion:isRec(e),calidad:e.q||null,formacion:LA.f,presionNuestra:c.pres_nos,presionRival:c.pres_riv,formacionRival:c.form_riv,ataqueNuestro:c.atq_nos,ataqueRival:c.atq_riv};
      const skip=new Set(["id","t","half","type","p","z","z2","q","loss","rec","txt","shot"]);
      Object.entries(e).forEach(([k,v])=>{ if(skip.has(k)) return;
        if(["gol","asis","col","errp","out","in","a","b","quien","lanz","tirador"].includes(k)) v=nm(v);
        if(k==="impl"&&Array.isArray(v)) v=v.map(nm);
        if(k==="zp"||k==="zt") v=zid(v);
        o[k]=v; });
      if(e.txt) o.resumen=e.txt;
      acciones.push(o);});
  });
  return {jugadores,partidos,segmentos,acciones};
}
const SCHEMA=`DATOS (objeto "datos"):
- jugadores: [{nombre, posicion, tambien, activo}]
- partidos: [{partido (rival), fecha, tipo (liga|amistoso), campo, jornada, minutosPorParte, formacionInicial, golesFavor, golesContra}]
- segmentos: tramos de partido sin cambios de alineación/formación/presión: [{partido, fecha, parte, desde, hasta, minutos, formacion, enCampo:[{jugador,puesto}], presionNuestra, presionRival, formacionRival, ataqueNuestro, ataqueRival}]. Sirven para minutos con un jugador en el campo, con una formación o una presión.
- acciones: [{partido, fecha, minuto, parte, tipo, jugador, zona, zonaDestino, esPerdida, esRecuperacion, calidad (good|bad), formacion, presionNuestra, presionRival, formacionRival, resumen, ...campos propios}]

function md(t){

const slug=n=>String(n||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,120)||"sin-nombre";
const rivalDoc=n=>(S.rivals||{})[slug(n)]||{name:n,notes:"",dorsales:{}};
function rivalNames(){return [...allSeasonMatches().map(m=>m.rival),...(S.ext||[]).filter(m=>seasonOf(m)===S.season).flatMap(m=>[m.teamA,m.teamB]),...((S.league||{}).teams||[])].filter((x,i,a)=>x&&x!==US()&&a.indexOf(x)===i).sort((a,b)=>a.localeCompare(b,"es"));}
function viewRivales(){
  const names=rivalNames(); const sel=S.rival&&names.includes(S.rival)?S.rival:null;
  const list=`<div class="card stack"><h3 style="margin:0">Equipos</h3><div class="row">${names.map(n=>`<button class="chip ${sel===n?"on":""}" data-act="rival" data-v="${esc(n)}">${esc(n)}</button>`).join("")||'<span class="muted">Aparecerán cuando crees partidos o añadas equipos en Clasificación.</span>'}</div></div>`;
  return `<div class="stack"><div class="row between"><h2>Rivales</h2></div>${list}${sel?rivalReport(sel):""}</div>`;
}
function rivalReport(n){
  const ms=seasonMatches().filter(m=>m.rival===n).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const R=rivalDoc(n); const ds=buildDataset(ms);
  const minBy=k=>{const o={};ds.segmentos.forEach(s=>{const v=s[k]||"Sin definir";o[v]=(o[v]||0)+s.minutos;});return Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([v,x])=>`<span class="pill">${esc(v)} · ${Math.round(x)}'</span>`).join("")||'<span class="muted">—</span>';};
  const occ=ds.acciones.filter(a=>a.tipo==="ocasion"&&a.side==="contra");
  const byOrig={}; occ.forEach(a=>{const k=a.origen||"Sin dato";byOrig[k]=(byOrig[k]||0)+1;});
  const heat={}; ms.forEach(m=>evs(m.id).forEach(e=>{if((e.type==="ocasion"&&e.side==="contra"&&!e.shot)||e.type==="tiro_c"){if(e.z){const k=zid(e.z);heat[k]=(heat[k]||0)+1;}}}));
  const hmax=Math.max(0,...Object.values(heat));
  const D={}; const g=k=>{k=String(k).trim();if(!k||/^no\s*s[eé]/i.test(k))return null;return D[k]=D[k]||{gol:0,asis:0,tiros:0,impl:0,err:0,lanz:0};};
  ds.acciones.forEach(a=>{ if(a.dgol){const o=g(a.dgol);if(o)o.gol++;} if(a.dasis){const o=g(a.dasis);if(o)o.asis++;} if(a.tipo==="tiro_c"&&a.dors){const o=g(a.dors);if(o)o.tiros++;}
    if(a.dimpl)String(a.dimpl).split(/[,\s]+/).forEach(x=>{const o=g(x);if(o)o.impl++;}); if(a.derr){const o=g(a.derr);if(o)o.err++;} if(a.ldors){const o=g(a.ldors);if(o)o.lanz++;} });
  const xms=(S.ext||[]).filter(m=>seasonOf(m)===S.season&&(m.teamA===n||m.teamB===n));
  xms.forEach(m=>evs(m.id).forEach(e=>{if(e.type!=="ocasion")return;const who=id=>{const P=pidParse(id);return P&&P.kind==="d"&&sideTeam(m,P.side)===n?g(P.v):null;};
    const o=e.xsh?who(e.xsh):null;if(o){o.impl++;if(isShotOcc(e))o.tiros++;if(e.acaba==="Gol")o.gol++;} const q=e.xas?who(e.xas):null;if(q)q.asis++;}));
  Object.keys(R.dorsales||{}).forEach(k=>g(k));
  const drs=Object.keys(D).sort((a,b)=>Number(a)-Number(b)||a.localeCompare(b));
  const TS=teamStats(ms);
  const bpC=["Córner","Penalti","Falta directa","Falta indirecta","Saque de banda"].map(t=>{const c=TS.bp[t+"|contra"];return c?`${t} ${c.n} (${c.occ} ocasiones, ${c.gol} goles)`:null}).filter(Boolean).join(" · ")||"—";
  return `<div class="stack">
    <div class="card stack"><h3 style="margin:0">${esc(n)} · partidos</h3>${ms.length?ms.map(m=>`<div class="row between"><span>${esc(m.date||"")} · ${m.kind==="amistoso"?"Amistoso":"Liga"} · ${m.home?"en casa":"fuera"}</span><span class="row"><span class="score" style="font-size:20px">${resultText(m)}</span>${resPill(m)}<button class="btn small" data-act="mopen" data-id="${m.id}">Abrir</button></span></div>`).join(""):'<p class="muted" style="margin:0">Todavía no habéis jugado contra este equipo.</p>'}</div>
    ${rivalExtCard(n)}
    <div class="grid2">
      <div class="card stack"><h3 style="margin:0">Cómo juegan</h3>
        <div class="stack" style="gap:4px"><span class="label">Formación</span><div class="row">${minBy("formacionRival")}</div></div>
        <div class="stack" style="gap:4px"><span class="label">Presión</span><div class="row">${minBy("presionRival")}</div></div>
        <div class="stack" style="gap:4px"><span class="label">Ataque</span><div class="row">${minBy("ataqueRival")}</div></div>
        <div class="stack" style="gap:4px"><span class="label">Balón parado a su favor</span><p style="margin:0;font-size:14px">${bpC}</p></div>
        <div class="stack" style="gap:4px"><span class="label">Sus ocasiones por origen</span><p style="margin:0;font-size:14px">${Object.entries(byOrig).map(([k,v])=>`${esc(k)} ${v}`).join(" · ")||"—"} · peligrosidad ${fx(occ.reduce((a,x)=>a+xgOf(x),0))}</p></div>
      </div>
      <div class="card stack"><h3 style="margin:0">Por dónde nos hacen daño</h3>${zonePitch({heat,max:hmax})}<details class="info"><summary>ⓘ Cómo se calcula</summary><p>Tiros en contra y zonas donde empiezan sus ocasiones.</p></details></div>
    </div>
    <div class="card stack"><h3 style="margin:0">Jugadores por dorsal</h3>
      <div class="scroll"><table><thead><tr><th class="n">Dorsal</th><th>Nombre</th><th>Posición</th><th>Pierna</th><th class="n">Goles</th><th class="n">Asist.</th><th class="n">Tiros</th><th class="n">En ocasiones</th><th class="n">Errores</th><th class="n">Lanza BP</th><th>Nota</th></tr></thead><tbody>
        ${drs.length?drs.map(k=>{const x=(R.dorsales||{})[k]||{},o=D[k];return `<tr><td class="n"><b>${esc(k)}</b></td><td>${esc(x.nombre||"")}</td><td>${esc(x.pos||"")}</td><td>${esc(x.pierna||"")}</td><td class="n">${o.gol||""}</td><td class="n">${o.asis||""}</td><td class="n">${o.tiros||""}</td><td class="n">${o.impl||""}</td><td class="n">${o.err||""}</td><td class="n">${o.lanz||""}</td><td>${esc(x.nota||"")}</td></tr>`}).join(""):'<tr><td colspan="11" class="muted">Los dorsales aparecen al registrar goles, tiros u ocasiones del rival, o al añadirlos abajo.</td></tr>'}
      </tbody></table></div>
      <form id="rdform" class="fields" data-n="${esc(n)}">
        <label class="field"><span class="label">Dorsal</span><input id="rd-n" inputmode="numeric" placeholder="10"></label>
        <label class="field"><span class="label">Nombre</span><input id="rd-name" placeholder="Si lo sabes"></label>
        <label class="field"><span class="label">Posición</span><input id="rd-pos" placeholder="Extremo"></label>
        <label class="field"><span class="label">Pierna buena</span><select id="rd-leg"><option value="">—</option><option>Derecha</option><option>Izquierda</option><option>Ambas</option></select></label>
        <label class="field"><span class="label">Nota</span><input id="rd-note" placeholder="Muy rápido"></label>
        <div class="field" style="justify-content:flex-end"><button class="btn primary" type="submit">Guardar dorsal</button></div>
      </form>
      <p class="muted" style="margin:0;font-size:13px">Si el dorsal ya existe, se actualizan sus datos.</p></div>
    <div class="card stack"><h3 style="margin:0">Observaciones</h3>
      ${ms.filter(m=>m.obsRival).map(m=>`<p style="margin:0"><span class="muted">${esc(m.date||"")}:</span> ${esc(m.obsRival)}</p>`).join("")}
      <form id="rnform" class="stack" data-n="${esc(n)}"><textarea id="rn-text" rows="4" placeholder="Notas generales para el próximo partido contra ellos">${esc(R.notes||"")}</textarea><div><button class="btn" type="submit">Guardar notas</button></div></form></div>
  </div>`;
}
/* lo que se sabe de un equipo por los partidos externos (contra otros equipos, no contra nosotros) */
function rivalExtCard(n){const ms=(S.ext||[]).filter(m=>seasonOf(m)===S.season&&(m.teamA===n||m.teamB===n)).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  if(!ms.length) return "";const T={of:0,oc:0,pf:0,pc:0,gf:0,gc:0,cl:0,clc:0,rr:0,O:{}};const forms={};
  const rows=ms.map(m=>{const me=m.teamA===n?"favor":"contra",sd=m.teamA===n?"A":"B",opp=m.teamA===n?m.teamB:m.teamA;const E=evs(m.id);const g=xGoals(m);const gf=sd==="A"?g.a:g.b,gc=sd==="A"?g.b:g.a;T.gf+=gf;T.gc+=gc;
    const oc=E.filter(e=>e.type==="ocasion");const mine=oc.filter(e=>e.side===me),th=oc.filter(e=>e.side!==me);
    T.of+=mine.length;T.oc+=th.length;T.pf+=mine.reduce((a,e)=>a+xgOf(e),0);T.pc+=th.reduce((a,e)=>a+xgOf(e),0);T.cl+=mine.filter(e=>e.pen||Number(e.pel)>=3).length;T.clc+=th.filter(e=>e.pen||Number(e.pel)>=3).length;
    mine.forEach(e=>{const k=e.pen?"Penalti":e.origen||"Sin dato";T.O[k]=(T.O[k]||0)+1;});const f=((m.xform||{})[sd])||"";if(f)forms[f]=(forms[f]||0)+1;
    return `<div class="row between"><span>${esc(m.date||"")} · ${sd==="A"?"local":"visitante"} contra <b>${esc(opp)}</b></span><span class="row"><span class="score" style="font-size:20px">${gf} – ${gc}</span><span class="muted num" style="font-size:12px">ocasiones ${mine.length} – ${th.length}</span><button class="btn small" data-act="mopen" data-id="${m.id}">Abrir</button></span></div>`;}).join("");
  const obs=ms.map(m=>{const v=m.teamA===n?m.obsA:m.obsB;return String(v||"").trim()?`<p style="margin:0;font-size:14px"><span class="muted">${esc(m.date||"")} (externo):</span> ${esc(v)}</p>`:"";}).join("");

    <p class="muted" style="margin:0;font-size:12px">Partidos externos de esta temporada: ${esc(n)} contra otros equipos. Van aparte de vuestros partidos porque dependen mucho del rival que tengan delante.</p></div>`;}

/* nombre del equipo y categoría por temporada (settings.teams = {temporada: {name, cat}}).
   Cambiarlo en una temporada no toca las demás; una temporada sin datos usa la anterior más cercana. */
function teamOf(season){const T=(S.settings||{}).teams||{};if(T[season]&&T[season].name)return T[season];
  const prev=Object.keys(T).filter(k=>T[k]&&T[k].name&&k<season).sort();if(prev.length)return T[prev[prev.length-1]];
  const old=String((S.settings||{}).subtitle||"Atlético Cabañal · Infantil A").split(" · ");return {name:old[0]||"Atlético Cabañal",cat:old.slice(1).join(" · ")};}
const US=()=>teamOf(S.season).name;
const usOf=m=>teamOf(m?seasonOf(m):S.season).name;
function leagueRows(){
  const L=S.league||{teams:[],results:[]};
  const games=[...(L.results||[]).map(r=>({...r,src:"manual"}))];
  allSeasonMatches().filter(m=>m.kind==="liga").forEach(m=>{const r=score(m);const gf=m.gf??r.f,gc=m.ga??r.c;
    if(m.gf==null&&!evs(m.id).length) return;
    games.push({id:"m:"+m.id,j:m.jornada||"",home:m.home?US():m.rival,away:m.home?m.rival:US(),hg:m.home?gf:gc,ag:m.home?gc:gf,src:"propio"});});
  (S.ext||[]).filter(m=>seasonOf(m)===S.season&&m.toLeague&&m.kind==="liga").forEach(m=>{if(m.gA==null&&!evs(m.id).length)return;const g=xGoals(m);
    games.push({id:"x:"+m.id,j:m.jornada||"",home:m.teamA,away:m.teamB,hg:g.a,ag:g.b,src:"externo"});});
  const T={}; const t=n=>T[n]=T[n]||{n,pj:0,g:0,e:0,p:0,gf:0,gc:0};
  [US(),...(L.teams||[])].forEach(t);
  games.forEach(g=>{const h=t(g.home),a=t(g.away);h.pj++;a.pj++;h.gf+=g.hg;h.gc+=g.ag;a.gf+=g.ag;a.gc+=g.hg;
    if(g.hg>g.ag){h.g++;a.p++;}else if(g.hg<g.ag){a.g++;h.p++;}else{h.e++;a.e++;}});
  const rows=Object.values(T).map(o=>({...o,dg:o.gf-o.gc,pts:o.g*3+o.e})).sort((a,b)=>b.pts-a.pts||b.dg-a.dg||b.gf-a.gf||a.n.localeCompare(b.n,"es"));
  return {rows,games};
}

document.addEventListener("click",e=>{keepY=null;const b=e.target&&e.target.closest?e.target.closest("[data-act]"):null;if(!b||!KEEP_ACTS.has(b.dataset.act))return;
  const el=document.getElementById("posspitch");if(el)keepY=el.getBoundingClientRect().top;},true);
if(typeof window.addEventListener==="function") window.addEventListener("click",()=>{if(keepY==null)return;const y0=keepY;keepY=null;
  const fix=()=>{const el=document.getElementById("posspitch");if(!el)return;const d=el.getBoundingClientRect().top-y0;if(Math.abs(d)>1)window.scrollBy(0,d);};fix();requestAnimationFrame(fix);});

    return;}

  const G=(o,k)=>o.a[k]||{g:0,b:0,n:0,pu:0};
  const plRow=o=>({"Partidos":o.pj,"Minutos":Math.round(o.min),"Acciones (participación)":o.acc||0,"Goles":o.gol,"Asistencias":o.asis,"Pases clave":o.clave,"Supera línea":o.sup,
    "Regates":G(o,"regate").n,"Centros que llegan":G(o,"centro").g,"Centros":G(o,"centro").n,"Ocasiones":o.occ||0,"Tiros a puerta":G(o,"disparo").pu||0,"Tiros":G(o,"disparo").n,"Pérdidas":o.perd,"Pérdidas bajo presión":o.perdP||0,"Pérdidas sin presión":o.perdNP||0,"Mala colocación ofensiva":G(o,"colof_m").n,"Malas decisiones":o.malas||0,"Fueras de juego":G(o,"fuera").n,"Faltas recibidas":G(o,"falta_r").n,
    "Recuperaciones":o.rec,"Cortes buenos":G(o,"corte").g,"Cortes":G(o,"corte").n,"Entradas acertadas":G(o,"entrada").g,"Entradas":G(o,"entrada").n,"Despejes buenos":G(o,"despeje").g,"Despejes":G(o,"despeje").n,"Duelos ganados":G(o,"duelo").g,"Duelos":G(o,"duelo").n,"Duelos aéreos ganados":o.aer?o.aer.g:0,"Duelos aéreos":o.aer?o.aer.n:0,"Errores defensivos leves":o.errL||0,"Errores defensivos graves":o.errG||0,"Errores defensivos en una acción":o.errA||0,"Errores defensivos de colocación":o.errC||0,"Presiones que fuerzan error":G(o,"fuerza").n,"Errores en ocasión rival":o.err,"Faltas cometidas":G(o,"falta_c").n,"Faltas tácticas":o.ftac||0,"Tarjetas":G(o,"tarjeta").n,"Buena actitud":G(o,"buenact").n,"Actitud negativa":G(o,"actitud").n,
    "Paradas":G(o,"parada").n,"Goles encajados (portero)":G(o,"golenc").n});
  const PT=computeStats(ms,{excl:1}).P;
  const jugadores=sortedPlayers().filter(p=>PT[p.id]&&(PT[p.id].min>0||PT[p.id].acc>0)).map(p=>({"Jugador":p.name,"Posición":p.pos||"",...plRow(PT[p.id])}));
  const porPartido=[]; ms.forEach(m=>{const P=computeStats([m]).P;sortedPlayers().forEach(p=>{const o=P[p.id];if(o&&(o.min>0||o.acc>0)){const r=ratings(m)[p.id];porPartido.push({"Fecha":m.date||"","Rival":m.rival,"Jugador":p.name,"Nota":r&&r.final!=null?Math.round(r.final*10)/10:"SC","Nota automática":r&&r.auto!=null?Math.round(r.auto*10)/10:"","Tu nota":r&&r.coach!=null?r.coach:"",...plRow(o)});}});});
  const acciones=[]; ms.forEach(m=>{evs(m.id).slice().sort((a,b)=>a.t-b.t).forEach(e=>{if(["actitud","ctx","marca","rcambio"].includes(e.type))return;
    const who=e.p||e.quien||e.tirador||e.gol||e.in||e.a||"";
    acciones.push({"Fecha":m.date||"","Rival":m.rival,"Parte":halfOf(m,e),"Minuto":fmt(e.t),"Jugador":who?pname(who):"","Acción":e.type==="ocasion"?(e.side==="favor"?"Ocasión a favor":"Ocasión en contra"):e.type==="pase"?"Pase":e.type==="cambio"?"Cambio":e.type==="posicion"?"Cambio de posición":e.type==="formacion"?"Cambio de formación":actL(e.type)+(e.side?(e.side==="favor"?" a favor":" en contra"):""),
      "Resultado":e.type==="pase"?(e.ok?"Acertado":"Fallado"):e.q==="bad"?"Mal":e.q==="good"?"Bien":"","Detalle":e.type==="pase"?[e.to?"a "+pname(e.to):"",e.clave?"clave":""].filter(Boolean).join(" · "):e.type==="ocasion"?[e.pen?"penalti":e.pel!=null?"nivel "+e.pel:"",e.origen,e.acaba].filter(Boolean).join(" · "):e.type==="cambio"?`entra ${pname(e.in)}, sale ${pname(e.out)}`:(e.txt||""),
      "Zona":e.z?zid(e.z):"","Zona destino":e.z2?zid(e.z2):"","Pérdida":isLoss(e)?"Sí":"","Recuperación":isRec(e)?"Sí":"","Peligrosidad":e.type==="ocasion"?r2(xgOf(e)):""});});});
  return {partidos,equipo,jugadores,porPartido,acciones};
}
async function doExport(){
  const dl=await capUse("downloads");
  if(!dl){showMsg("En esta vista no se pueden descargar archivos. Prueba con otro navegador.");return;}
  const B=excelBook();
  const blob=xlsxBlob([["Jugadores temporada",B.jugadores],["Equipo por partido",B.equipo],["Jugadores por partido",B.porPartido],["Partidos",B.partidos],["Acciones",B.acciones]]);
  const name=`estadisticas-${slug(subtitle()).slice(0,40)}-${S.season}.xlsx`;
  try{await dl.save({filename:name,data:blob});showMsg("Excel exportado.");}
  catch(err){if(err&&err.code!=="declined")showMsg("No se ha podido exportar el Excel.");}
}
async function doBackup(){
  const dl=await capUse("downloads");
  if(!dl){showMsg("En esta vista no se pueden descargar archivos. Prueba con otro navegador.");return;}
  const events={};allMatches().forEach(m=>{const L=evs(m.id);if(L.length)events[m.id]=L;});
  const j={app:"analisis-futbol",version:2,ai:S.ai||{},fecha:new Date().toISOString(),players:S.players,matches:S.matches,xmatches:S.ext||[],events,leagues:S.leagues||{},rivals:S.rivals||{},settings:S.settings||{}};
  const blob=new Blob([JSON.stringify(j)],{type:"application/json"});
  const d=new Date().toISOString().slice(0,10);
  try{await dl.save({filename:`copia-${slug(subtitle()).slice(0,40)}-${d}.json`,data:blob});showMsg("Copia de seguridad descargada.");}
  catch(err){if(err&&err.code!=="declined")showMsg("No se ha podido descargar la copia.");}
}
async function doImport(){
  const j=S.imp;S.imp=null;
  j.players.forEach(p=>{const {id,...r}=p;if(id)writeDoc("players/"+id,r);});
  j.matches.forEach(m=>{const {id,...r}=m;if(id)writeDoc("matches/"+id,r);});
  (Array.isArray(j.xmatches)?j.xmatches:[]).forEach(m=>{const {id,...r}=m;if(id)writeDoc("xmatches/"+id,{...r,ext:true});});
  Object.entries(j.events).forEach(([mid,list])=>{if(Array.isArray(list))saveEvents(mid,list,{upsert:true});});
  if(j.settings&&typeof j.settings==="object"&&Object.keys(j.settings).length) saveSettings(j.settings);
  if(j.league) writeDoc("league/"+LEGACY_SEASON,{teams:j.league.teams||[],results:j.league.results||[]});
  if(j.leagues) Object.entries(j.leagues).forEach(([k,v])=>writeDoc("league/"+(k==="main"?LEGACY_SEASON:k),v));
  if(j.ai&&typeof j.ai==="object") Object.entries(j.ai).forEach(([k,v])=>{if(Array.isArray(v))writeDoc("ai/"+k,{list:v});});
  if(j.rivals) Object.entries(j.rivals).forEach(([k,v])=>writeDoc("rivals/"+k,v));
  showMsg("Copia importada.");render();
}

render(); initDB();
